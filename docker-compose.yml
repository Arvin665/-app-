services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mall_office_asset}
      MYSQL_USER: ${MYSQL_USER:-asset_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/app/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-asset_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-mall_office_asset}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      SENSITIVE_FIELD_KEY: ${SENSITIVE_FIELD_KEY:?请在 .env 中设置 SENSITIVE_FIELD_KEY}
      BOOTSTRAP_INVITE_CODE: ${BOOTSTRAP_INVITE_CODE:-246810}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      FILE_URL_TTL_SECONDS: ${FILE_URL_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-90}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_MAX_PDF_PAGES: ${OCR_MAX_PDF_PAGES:-30}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-20}
      ASR_ENGINE: ${ASR_ENGINE:-sensevoice}
      SENSE_VOICE_MODEL_PATH: /app/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17
      VOSK_MODEL_PATH: /app/models/vosk-model-small-cn-0.22
      ASR_TIMEOUT_SECONDS: ${ASR_TIMEOUT_SECONDS:-180}
      FFMPEG_BINARY: /usr/bin/ffmpeg
      UPLOAD_DIR: /app/uploads
      AUTO_CREATE_TABLES: "false"
      TZ: Asia/Shanghai
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/mobile.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  uploads_data:
