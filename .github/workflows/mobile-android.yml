name: Mobile Android Debug APK

on:
  push:
    paths:
      - "mobile-app/**"
      - "docker/mobile.Dockerfile"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build H5 assets
        working-directory: mobile-app
        env:
          VITE_API_BASE_URL: ${{ vars.ASSET_LIBRARY_API_BASE_URL || 'http://10.0.2.2:8000/api/v1' }}
          VITE_BOOTSTRAP_INVITE_HINT: "246810"
        run: npm run build:h5

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: node scripts/cap-sync-android-debug.mjs

      - name: Build Android debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-library-android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
