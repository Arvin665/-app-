name: Mobile Android Debug APK

on:
  push:
    paths:
      - "mobile-app/**"
      - "docker/mobile.Dockerfile"
      - ".github/workflows/mobile-android.yml"
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -path '*/bin/sdkmanager' | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          "$SDKMANAGER" --list_installed
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android platform
        run: |
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build H5 assets
        working-directory: mobile-app
        env:
          VITE_API_BASE_URL: ${{ vars.ASSET_LIBRARY_API_BASE_URL || 'https://app.sh-credible.com/api/v1' }}
        run: npm run build:h5

      - name: Sync Capacitor Android project
        working-directory: mobile-app
        run: node scripts/cap-sync-android-release.mjs

      - name: Build Android debug APK
        working-directory: mobile-app/android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee android-build.log

      - name: Verify debug APK
        working-directory: mobile-app/android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asset-library-android-build-log
          path: mobile-app/android/android-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-library-android-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
