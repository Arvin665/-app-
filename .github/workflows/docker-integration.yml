name: Docker MySQL Redis Integration

on:
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/docker-integration.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/docker-integration.yml"
  workflow_dispatch:

concurrency:
  group: docker-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOCKER_MIRROR: ""    # 新增这一行！CI环境强制清空镜像加速地址
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's#^MYSQL_ROOT_PASSWORD=.*#MYSQL_ROOT_PASSWORD=ci-root-password#' .env
          sed -i 's#^MYSQL_PASSWORD=.*#MYSQL_PASSWORD=ci-database-password#' .env
          sed -i 's#^SENSITIVE_FIELD_KEY=.*#SENSITIVE_FIELD_KEY=ci-sensitive-field-key-32-characters#' .env
          sed -i 's#^BOOTSTRAP_INVITE_CODE=.*#BOOTSTRAP_INVITE_CODE=246810#' .env
          sed -i 's#^PUBLIC_BASE_URL=.*#PUBLIC_BASE_URL=http://web#' .env
          sed -i 's#^WEB_BIND=.*#WEB_BIND=0.0.0.0#' .env
          sed -i 's#^WEB_PORT=.*#WEB_PORT=80#' .env

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application images
        run: docker compose build

      - name: Start full stack
        run: |
          export DOCKER_MIRROR=""
          docker compose up -d --wait --wait-timeout 900

      - name: Show service status
        run: docker compose ps

      - name: Verify Nginx and API entrypoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1/ > /tmp/asset-library-index.html
          grep -q 'assets/' /tmp/asset-library-index.html
          curl --fail --silent --show-error http://127.0.0.1/api/v1/health | grep -q '"status":"ok"'
          docker compose exec -T redis redis-cli ping | grep -qx PONG
          docker compose exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent

      - name: Verify MySQL Redis OCR ASR and uploads
        run: |
          docker compose run --rm --no-deps -T \
            -v "${GITHUB_WORKSPACE}:/work" \
            backend python scripts/verify_deployment.py \
            --base-url http://web/api/v1 \
            --state-file /work/deployment-state.json \
            --speech-wav /app/models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/test_wavs/zh.wav \
            --mode write

      - name: Restart stack without deleting volumes
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 900

      - name: Verify data survived restart
        run: |
          docker compose run --rm --no-deps -T \
            -v "${GITHUB_WORKSPACE}:/work" \
            backend python scripts/verify_deployment.py \
            --base-url http://web/api/v1 \
            --state-file /work/deployment-state.json \
            --mode verify

      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose.logs

      - name: Upload Compose logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-compose-logs
          path: docker-compose.logs
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up
        if: always()
        run: docker compose down -v
